name: build-meilisearch

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout meilisearch
        uses: actions/checkout@v4
        with:
          repository: meilisearch/meilisearch
          ref: v1.55.0

      - name: Install rustup + toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Add aarch64 musl target (native host)
        run: |
          rustup target add aarch64-unknown-linux-musl
          rustup show

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build meilisearch (release, musl static, native aarch64)
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --release --target aarch64-unknown-linux-musl --bin meilisearch

      - name: Verify binary
        run: |
          file target/aarch64-unknown-linux-musl/release/meilisearch
          ./target/aarch64-unknown-linux-musl/release/meilisearch --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meilisearch-aarch64-musl
          path: target/aarch64-unknown-linux-musl/release/meilisearch
